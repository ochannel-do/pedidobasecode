name: Verify
on:
  workflow_call:
  pull_request:
    branches: [develop, master]
  push:
    branches: ['feature/**', 'release/**', 'hotfix/**']
permissions:
  contents: read
jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validar destino e sequência TDD do PR
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/gitflow_policy.py --source "$SOURCE_BRANCH" --target "$TARGET_BRANCH" --base "$BASE_SHA" --head "$HEAD_SHA"
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: python3 -m unittest discover -s scripts/tests -v
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B clean verify
      - name: Exigir relatório de cobertura unitária
        run: test -s target/site/jacoco/jacoco.xml
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Analisar segredos no histórico
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
      - name: Analisar manifests
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.75.0
          severity: HIGH,CRITICAL
          exit-code: '1'
