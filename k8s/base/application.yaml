apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidobasecode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidobasecode
  template:
    metadata:
      labels:
        app: pedidobasecode
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/ochannel-do/pedidobasecode:bootstrap
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pedidobasecode-config
            - secretRef:
                name: pedidobasecode-db
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pedidobasecode
spec:
  selector:
    app: pedidobasecode
  ports:
    - name: http
      port: 80
      targetPort: http
