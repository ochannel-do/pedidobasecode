apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pedidobasecode-prod
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/ochannel-do/pedidobasecode.git
  destinations:
    - namespace: pedidobasecode-prod
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pedidobasecode-prod
  namespace: argocd
spec:
  project: pedidobasecode-prod
  source:
    repoURL: https://github.com/ochannel-do/pedidobasecode.git
    targetRevision: deploy
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: pedidobasecode-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - Prune=false
