apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pedidobasecode-prod
resources:
  - ../../base
configMapGenerator:
  - name: pedidobasecode-config
    literals:
      - DB_URL=jdbc:postgresql://postgresql.databases-prod.svc.cluster.local:5432/pedidobasecode_prod
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE=readinessState,db
images:
  - name: ghcr.io/ochannel-do/pedidobasecode
    newTag: bootstrap
