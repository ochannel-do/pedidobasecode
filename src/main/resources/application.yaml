spring:
  application:
    name: loja
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loja}
    username: ${DB_USER:loja}
    password: ${DB_PASSWORD:loja_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 2s
