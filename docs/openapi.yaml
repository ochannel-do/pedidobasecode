openapi: 3.1.0
info:
  title: Loja — Pedidos
  version: 1.0.0
paths:
  /pedidos:
    post:
      operationId: criarPedido
      summary: Cria pedido e reserva todos os itens atomicamente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedido'
            example:
              itens:
                - produtoId: 00000000-0000-0000-0000-000000000001
                  quantidade: 2
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, const: CRIADO}
        '400':
          description: ENTRADA_INVALIDA — campos inválidos ou produtos repetidos
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: ESTOQUE_INSUFICIENTE — reserva integralmente revertida
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: 'about:blank', title: ESTOQUE_INSUFICIENTE, status: 409, detail: Estoque insuficiente para os itens solicitados, code: ESTOQUE_INSUFICIENTE}
        '500':
          description: ERRO_INTERNO — transação revertida
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    CriarPedido:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          description: Um item por produto; produtos repetidos são rejeitados
          items:
            type: object
            required: [produtoId, quantidade]
            properties:
              produtoId: {type: string, format: uuid}
              quantidade: {type: integer, minimum: 1, maximum: 2147483647}
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string, enum: [ENTRADA_INVALIDA, ESTOQUE_INSUFICIENTE, ERRO_INTERNO]}
